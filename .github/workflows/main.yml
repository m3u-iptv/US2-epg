name: Update EPG
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Files
        run: |
          mkdir -p config data
          unzip -o India_aasthatv.com.zip -d config/
          cp WebGrab-.config.xml config/WebGrab++.config.xml
      - name: Run WebGrab+Plus
        run: |
          docker run --rm \
            -v $GITHUB_WORKSPACE/config:/config \
            -v $GITHUB_WORKSPACE/data:/data \
            lscr.io/linuxserver/webgrabplus:latest
      - name: Save guide.xml
        run: |
          cp data/guide.xml ./guide.xml
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add guide.xml
          git commit -m "Update EPG" || exit 0
          git push
          
