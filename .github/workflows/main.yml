name: Auto Update EPG
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Files & Run WebGrab+Plus
        run: |
          mkdir -p config data
          
          # Official site se direct .ini aur .channels.xml download karna
          curl -sL "https://webgrabplus.com" -o config/aasthatv.com.ini
          curl -sL "https://webgrabplus.com" -o channels.xml
          
          # Automatic WebGrab++.config.xml banana
          cat << 'EOF' > config/WebGrab++.config.xml
          <?xml version="1.0"?>
          <settings>
            <filename>/data/epg.xml</filename>
            <mode></mode>
            <postprocess grab="y" run="n">mdb</postprocess>
            <user-agent>Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36</user-agent>
            <logging>on</logging>
            <retry time-out="5">4</retry>
            <timespan>1</timespan>
            <update>f</update>
          EOF
          grep "<channel " channels.xml >> config/WebGrab++.config.xml
          echo "</settings>" >> config/WebGrab++.config.xml
          
          # Seedha WebGrab+Plus binary run karke exit karna
          docker run --rm --entrypoint "" \
            -v $GITHUB_WORKSPACE/config:/config \
            -v $GITHUB_WORKSPACE/data:/data \
            lscr.io/linuxserver/webgrabplus:latest \
            dotnet /app/wg++/bin.net/WebGrab+Plus.dll /config
          
          # epg.xml.gz file banana
          gzip -kf data/epg.xml
          cp data/epg.xml.gz ./epg.xml.gz

      - name: Save epg.xml.gz
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add epg.xml.gz
          git commit -m "Auto update epg.xml.gz" || exit 0
          git push
          
