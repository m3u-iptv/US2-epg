name: Update EPG
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run WebGrab+Plus
        run: |
          wget https://webgrabplus.com
          tar -zxvf WebGrabPlus_V5.6_install.tar.gz
          cd ~/.wg++
          ./install.sh
          cd $GITHUB_WORKSPACE
          unzip -o India_aasthatv.com.zip
          cp WebGrab-.config.xml ~/.wg++/WebGrab++.config.xml
          cp *.ini ~/.wg++/
          ~/.wg++/run.sh
          cp ~/.wg++/guide.xml ./guide.xml
      - name: Save guide.xml
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add guide.xml
          git commit -m "Update EPG" || exit 0
          git push
          
