name: Auto Update US2 EPG

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  filter-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Filter EPG
        run: |
      https://epgshare01.online/epgshare01/epg_ripper_US2.xml.gz" -o full_epg.xml.gz
          gunzip -f full_epg.xml.gz
          
          python3 -c '
          import xml.etree.ElementTree as ET
          
          target_ids = [
              "Sony.KAL.us2",
              "and.TV.us2",
              "AAPKA.Colors.US.us2",
              "Zee.TV.us2"
          ]
          
          tree = ET.parse("full_epg.xml")
          root = tree.getroot()
          
          new_root = ET.Element("tv", root.attrib)
          
          for ch in root.findall("channel"):
              if ch.get("id") in target_ids:
                  new_root.append(ch)
                  
          for prog in root.findall("programme"):
              if prog.get("channel") in target_ids:
                  new_root.append(prog)
                  
          new_tree = ET.ElementTree(new_root)
          ET.indent(new_tree, space="  ")
          new_tree.write("us2.xml", encoding="utf-8", xml_declaration=True)
          '

      - name: Save and Push Filtered EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add us2.xml
          git commit -m "Update EPG channels" || exit 0
          git push

