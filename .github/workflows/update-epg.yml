name: Filter EPG Daily

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  filter-epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and Filter
        run: |
          curl -sL "https://epgshare01.online" -o full.xml.gz
          gunzip -f full.xml.gz
          python3 filter.py
          gzip -f custom_epg.xml
      - name: Save File
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add custom_epg.xml.gz
          git commit -m "Update EPG" || exit 0
          git push
          
