name: Update UK EPG
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python epg_filter.py
      - run: |
          ls -lh epg.xml.gz
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f epg.xml.gz
          git commit -m "Update UK EPG" || echo "No Change"
          git push || git push --force
