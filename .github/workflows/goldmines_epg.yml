name: Auto Update Goldmines EPG

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-goldmines-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 curl_cffi

      - name: Run Goldmines EPG scraper
        run: python goldmines_scraper.py

      - name: Commit and push updated EPG
        run: |
          git config --global user.name "EPG Bot"
          git config --global user.email "bot@://github.com"
          git add goldmines.xml.gz
          git commit -m "Auto-update goldmines.xml.gz" || exit 0
          git push
          
